name: 안드로이드 앱 만들기

# 혜광goat 안드로이드 앱(APK)을 만드는 순서표예요. 이 파일 하나에 앱 본체가 다 들어 있어요.
# index.html을 새로 올리면 앱도 저절로 새로 만들어져요.
# 칠판처럼 웹 엔진이 오래된 기기(크롬 83)에서도 돌아가게, 앱에 넣을 때 자동으로 바꿔 넣어요.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 자바 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 그래들 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 앱 본체 파일 펼치기
        shell: bash
        run: |
          set -e
          mkdir -p "$(dirname 'android/settings.gradle')"
          cat > 'android/settings.gradle' <<'GOATEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "hyegwang-goat-android"
          include ':app'
          GOATEOF

          mkdir -p "$(dirname 'android/build.gradle')"
          cat > 'android/build.gradle' <<'GOATEOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          GOATEOF

          mkdir -p "$(dirname 'android/gradle.properties')"
          cat > 'android/gradle.properties' <<'GOATEOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          GOATEOF

          mkdir -p "$(dirname 'android/app/build.gradle')"
          cat > 'android/app/build.gradle' <<'GOATEOF'
          plugins {
              id 'com.android.application'
          }

          // GitHub에서 만들 때마다 번호가 1씩 올라가서, 새 앱을 깔면 예전 앱 위에 바로 덮어 깔려요.
          def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

          android {
              namespace 'io.github.chiwookhan81.hyegwanggoat'
              compileSdk 34

              defaultConfig {
                  applicationId 'io.github.chiwookhan81.hyegwanggoat'
                  minSdk 24
                  targetSdk 34
                  versionCode runNumber
                  versionName "1.0.${runNumber}"
              }

              // 시험용 서명 열쇠예요. 플레이스토어에 올릴 때는 따로 만든 열쇠를 써야 해요.
              signingConfigs {
                  test {
                      storeFile file('../signing/test.keystore')
                      storePassword 'hyegwang'
                      keyAlias 'hyegwang'
                      keyPassword 'hyegwang'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.test
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          GOATEOF

          mkdir -p "$(dirname 'android/prepare.py')"
          cat > 'android/prepare.py' <<'GOATEOF'
          # 앱 만들기 준비: 저장소의 index.html(혜광goat)을 오래된 웹 엔진(크롬 83)에서도 돌아가게 바꿔
          # 앱 안(assets)에 넣고, 월이 그림으로 아이콘을 만들어요.
          #   사용법: python3 prepare.py <index.html> <assets폴더> <res폴더> <esbuild실행파일> <tasks-vision폴더>
          import base64, gzip, io, pathlib, re, subprocess, sys

          src, assets, res, esbuild, mpdir = sys.argv[1:6]
          assets = pathlib.Path(assets); res = pathlib.Path(res); mpdir = pathlib.Path(mpdir)
          html = pathlib.Path(src).read_text(encoding='utf-8')
          T = 'chrome83'

          def esb(code, loader, extra=()):
              r = subprocess.run([esbuild, '--loader=' + loader, '--target=' + T, '--log-level=error', '--charset=utf8', *extra],
                                 input=code.encode('utf-8'), capture_output=True)
              if r.returncode:
                  sys.exit('esbuild 오류: ' + r.stderr.decode('utf-8', 'replace')[:2000])
              return r.stdout.decode('utf-8')

          def pack(b):  # gzip → base64 (혜광goat가 쓰는 방식 그대로)
              return base64.b64encode(gzip.compress(b, 9)).decode()

          def unpack(t):
              return gzip.decompress(base64.b64decode(t))

          # 1) CSS: inset 같은 새 속성을 옛 방식으로 바꿔요.
          html = re.sub(r'(<style[^>]*>)(.*?)(</style>)',
                        lambda m: m.group(1) + esb(m.group(2), 'css') + m.group(3), html, flags=re.S)
          print('CSS 바꿈, 남은 inset:', len(re.findall(r'(?<![\w-])inset\s*:', ''.join(re.findall(r'<style[^>]*>(.*?)</style>', html, re.S)))))

          # 2) 화면 프로그램(일반 script): 새 문법을 옛 문법으로 바꿔요.
          def fix_script(m):
              attrs, body = m.group(1), m.group(2)
              if 'type=' in attrs and 'javascript' not in attrs:
                  return m.group(0)  # text/plain 같은 데이터 칸은 그대로
              if not body.strip():
                  return m.group(0)
              return '<script' + attrs + '>' + esb(body, 'js') + '</script>'
          html = re.sub(r'<script([^>]*)>(.*?)</script>', fix_script, html, flags=re.S)

          # 3) 몸 관절 인식기(MediaPipe): 새 문법을 바꾸고, SIMD 없는 wasm으로 갈아 끼워요.
          def swap(id_, new_text):
              global html
              pat = re.compile(r'(<script[^>]*id="' + id_ + r'"[^>]*>)\s*[A-Za-z0-9+/=\s]+(</script>)')
              if not pat.search(html):
                  sys.exit(id_ + ' 칸을 찾지 못했어요.')
              html = pat.sub(lambda m: m.group(1) + new_text + m.group(2), html, count=1)

          def get(id_):
              m = re.search(r'<script[^>]*id="' + id_ + r'"[^>]*>\s*([A-Za-z0-9+/=\s]+)</script>', html)
              return unpack(m.group(1))

          bundle = get('mp_b').decode('utf-8')
          swap('mp_b', pack(esb(bundle, 'js', ['--format=esm']).encode('utf-8')))
          wasm_dir = mpdir / 'wasm'
          loader_ns = (wasm_dir / 'vision_wasm_nosimd_internal.js').read_text(encoding='utf-8')
          wasm_ns = (wasm_dir / 'vision_wasm_nosimd_internal.wasm').read_bytes()
          swap('mp_l', pack(esb(loader_ns, 'js').encode('utf-8')))
          swap('mp_w', pack(wasm_ns))
          print('인식기 바꿈: SIMD 없는 wasm', len(wasm_ns), 'bytes')

          # 4) 맨 앞에 옛 엔진 보충 + 목소리 연결을 끼워 넣어요.
          m = re.search(r'<head[^>]*>', html, re.I)
          if not m:
              sys.exit('index.html에서 <head>를 찾지 못했어요.')
          html = html[:m.end()] + '\n<script src="compat.js"></script><script src="tts-bridge.js"></script>' + html[m.end():]
          assets.mkdir(parents=True, exist_ok=True)
          (assets / 'index.html').write_text(html, encoding='utf-8')
          print('앱 안에 넣음:', (assets / 'index.html').stat().st_size, 'bytes')

          # 5) 월이 그림으로 아이콘 만들기
          from PIL import Image, ImageDraw
          mm = re.search(r'["\']?c_wol_cheer["\']?\s*:\s*["\']data:image/[a-z]+;base64,([A-Za-z0-9+/=]+)', html)
          img = Image.open(io.BytesIO(base64.b64decode(mm.group(1)))).convert('RGBA')
          crop = img.crop((0, 0, img.width, int(img.height * 0.62))); crop = crop.crop(crop.getbbox())
          BG = (127, 180, 230, 255)
          def fg(size, scale):
              c = Image.new('RGBA', (size, size), (0, 0, 0, 0)); t = int(size * scale)
              r = min(t / crop.width, t / crop.height)
              k = crop.resize((int(crop.width * r), int(crop.height * r)), Image.LANCZOS)
              c.paste(k, ((size - k.width) // 2, (size - k.height) // 2), k); return c
          for d, s in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              (res / f'mipmap-{d}').mkdir(parents=True, exist_ok=True)
              S = s * 4; im = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              ImageDraw.Draw(im).rounded_rectangle([0, 0, S - 1, S - 1], radius=int(S * 0.22), fill=BG)
              im.alpha_composite(fg(S, 0.82))
              im.resize((s, s), Image.LANCZOS).save(res / f'mipmap-{d}/ic_launcher.png')
              A = int(s * 108 / 48)
              fg(A * 4, 0.60).resize((A, A), Image.LANCZOS).save(res / f'mipmap-{d}/ic_launcher_foreground.png')
          print('아이콘 완성')
          GOATEOF

          mkdir -p "$(dirname 'android/app/src/main/AndroidManifest.xml')"
          cat > 'android/app/src/main/AndroidManifest.xml' <<'GOATEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- '움직여 봐요'에서 몸의 움직임을 알아보려고 카메라를 써요. 영상은 저장하거나 보내지 않아요. -->
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.front" android:required="false" />

              <!-- 안드로이드 11부터는 이걸 적어 둬야 기기의 한국어 목소리(TTS)를 쓸 수 있어요. -->
              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:largeHeap="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          GOATEOF

          mkdir -p "$(dirname 'android/app/src/main/java/io/github/chiwookhan81/hyegwanggoat/MainActivity.java')"
          cat > 'android/app/src/main/java/io/github/chiwookhan81/hyegwanggoat/MainActivity.java' <<'GOATEOF'
          package io.github.chiwookhan81.hyegwanggoat;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.webkit.WebViewAssetLoader;

          import java.util.Arrays;
          import java.util.Locale;

          /**
           * 혜광goat 안드로이드 앱.
           * 앱 안에 넣어 둔 index.html을 웹뷰로 열고, 카메라 권한은 브라우저가 아니라 앱이 직접 받아요.
           * 주소를 https://appassets.androidplatform.net 으로 열어서 페이지가 '안전한 주소'로 인정받게 해요.
           * (카메라와 관절 인식기는 안전한 주소에서만 켜져요.)
           */
          public class MainActivity extends Activity {

              private static final String HOST = "appassets.androidplatform.net";
              private static final String START_URL = "https://" + HOST + "/assets/index.html";
              private static final int REQ_CAMERA = 7;

              private WebView web;
              private PermissionRequest pendingRequest;
              private TextToSpeech tts;
              private volatile boolean ttsReady = false;
              private long lastBack = 0;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON); // 수업 중 화면이 꺼지지 않게

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);                 // 설정 저장(localStorage)
                  s.setMediaPlaybackRequiresUserGesture(false); // 효과음·카메라 영상이 바로 나오게
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setTextZoom(100);                           // 기기 글자 크기 설정에 화면이 깨지지 않게

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .setDomain(HOST)
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          if (HOST.equals(u.getHost())) return false;
                          // 앱 밖 주소는 기기 브라우저로 열어요.
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) { }
                          return true;
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> handlePermission(request));
                      }

                      @Override
                      public void onPermissionRequestCanceled(PermissionRequest request) {
                          if (pendingRequest == request) pendingRequest = null;
                      }
                  });

                  // 웹뷰에는 브라우저의 '컴퓨터 목소리'가 없어서, 안드로이드 목소리(TTS)로 이어 줘요.
                  web.addJavascriptInterface(new TtsBridge(), "AndroidTTS");
                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          int r = tts.setLanguage(Locale.KOREAN);
                          ttsReady = r != TextToSpeech.LANG_MISSING_DATA && r != TextToSpeech.LANG_NOT_SUPPORTED;
                      }
                  });

                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl(START_URL);
                  }
              }

              private void handlePermission(PermissionRequest request) {
                  boolean wantsCamera = Arrays.asList(request.getResources())
                          .contains(PermissionRequest.RESOURCE_VIDEO_CAPTURE);
                  if (!wantsCamera) {
                      request.deny();
                      return;
                  }
                  if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                      request.grant(new String[]{PermissionRequest.RESOURCE_VIDEO_CAPTURE});
                  } else {
                      pendingRequest = request;
                      requestPermissions(new String[]{Manifest.permission.CAMERA}, REQ_CAMERA);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode != REQ_CAMERA || pendingRequest == null) return;
                  boolean ok = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                  if (ok) {
                      pendingRequest.grant(new String[]{PermissionRequest.RESOURCE_VIDEO_CAPTURE});
                  } else {
                      pendingRequest.deny();
                      Toast.makeText(this, "카메라를 허용해야 '움직여 봐요'를 할 수 있어요.", Toast.LENGTH_LONG).show();
                  }
                  pendingRequest = null;
              }

              /** index.html 안의 tts-bridge.js가 부르는 목소리 기능 */
              private class TtsBridge {
                  @JavascriptInterface
                  public boolean ready() {
                      return ttsReady;
                  }

                  @JavascriptInterface
                  public void speak(String text, float rate, float pitch, float volume) {
                      if (!ttsReady || text == null) return;
                      tts.setSpeechRate(rate > 0 ? rate : 1f);
                      tts.setPitch(pitch > 0 ? pitch : 1f);
                      Bundle p = new Bundle();
                      p.putFloat(TextToSpeech.Engine.KEY_PARAM_VOLUME, Math.max(0f, Math.min(1f, volume)));
                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, p, "goat" + System.nanoTime());
                  }

                  @JavascriptInterface
                  public void stop() {
                      if (tts != null) tts.stop();
                  }
              }

              // 학생이 실수로 뒤로 가기를 눌러도 바로 닫히지 않게, 두 번 눌러야 닫혀요.
              @Override
              public void onBackPressed() {
                  long now = System.currentTimeMillis();
                  if (now - lastBack < 2000) {
                      super.onBackPressed();
                  } else {
                      lastBack = now;
                      Toast.makeText(this, "한 번 더 누르면 앱이 닫혀요.", Toast.LENGTH_SHORT).show();
                  }
              }

              // 위아래 안드로이드 막대를 숨겨 화면을 꽉 채워요. (가장자리에서 밀면 잠깐 나와요)
              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }

              @SuppressWarnings("deprecation")
              private void hideSystemBars() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      WindowInsetsController c = getWindow().getInsetsController();
                      if (c != null) {
                          c.hide(WindowInsets.Type.systemBars());
                          c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }

              @Override
              protected void onPause() {
                  if (tts != null) tts.stop();
                  web.onPause();
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  if (tts != null) tts.shutdown();
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
          GOATEOF

          mkdir -p "$(dirname 'android/app/src/main/assets/tts-bridge.js')"
          cat > 'android/app/src/main/assets/tts-bridge.js' <<'GOATEOF'
          // 혜광goat 앱용: 웹뷰의 브라우저 '컴퓨터 목소리'(speechSynthesis)는 소리가 나지 않아서
          // 안드로이드 목소리(TTS)로 바꿔 이어 줍니다. 앱 밖(크롬 등)에서는 아무 일도 하지 않아요.
          (function () {
            if (!window.AndroidTTS) return;
            var voices = [{ name: 'Android 한국어', lang: 'ko-KR', default: true, localService: true, voiceURI: 'android-tts' }];
            function Utterance(text) {
              this.text = text || ''; this.lang = 'ko-KR'; this.voice = null;
              this.rate = 1; this.pitch = 1; this.volume = 1;
            }
            var synth = {
              speaking: false, pending: false, paused: false, onvoiceschanged: null,
              getVoices: function () { return voices; },
              speak: function (u) {
                try {
                  var v = (u.volume == null) ? 1 : Number(u.volume);
                  window.AndroidTTS.speak(String(u.text || ''), Number(u.rate) || 1, Number(u.pitch) || 1, isNaN(v) ? 1 : v);
                } catch (e) { }
              },
              cancel: function () { try { window.AndroidTTS.stop(); } catch (e) { } },
              pause: function () { }, resume: function () { },
              addEventListener: function () { }, removeEventListener: function () { }
            };
            try {
              Object.defineProperty(window, 'speechSynthesis', { value: synth, configurable: true, writable: true });
              Object.defineProperty(window, 'SpeechSynthesisUtterance', { value: Utterance, configurable: true, writable: true });
            } catch (e) {
              window.speechSynthesis = synth;
              window.SpeechSynthesisUtterance = Utterance;
            }
          })();
          GOATEOF

          mkdir -p "$(dirname 'android/app/src/main/assets/compat.js')"
          cat > 'android/app/src/main/assets/compat.js' <<'GOATEOF'
          // 혜광goat 앱용: 오래된 웹 엔진(칠판의 크롬 83 등)에서도 돌아가게 빈 기능을 채워 줘요.
          (function () {
            // 1) 둥근 네모 그리기(roundRect)는 크롬 99부터 있어요. 없으면 직접 그려 줘요.
            var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
            function rr(x, y, w, h, r) {
              if (r == null) r = 0;
              if (typeof r === 'object' && r.length != null) r = r.length ? r[0] : 0;
              if (typeof r === 'object' && r && 'x' in r) r = r.x;
              r = Math.max(0, Math.min(+r || 0, Math.abs(w) / 2, Math.abs(h) / 2));
              this.moveTo(x + r, y);
              this.lineTo(x + w - r, y);
              this.arcTo(x + w, y, x + w, y + r, r);
              this.lineTo(x + w, y + h - r);
              this.arcTo(x + w, y + h, x + w - r, y + h, r);
              this.lineTo(x + r, y + h);
              this.arcTo(x, y + h, x, y + h - r, r);
              this.lineTo(x, y + r);
              this.arcTo(x, y, x + r, y, r);
              this.closePath();
              return this;
            }
            if (P && !P.roundRect) P.roundRect = rr;
            if (window.Path2D && !Path2D.prototype.roundRect) Path2D.prototype.roundRect = rr;
            if (window.OffscreenCanvasRenderingContext2D && !OffscreenCanvasRenderingContext2D.prototype.roundRect)
              OffscreenCanvasRenderingContext2D.prototype.roundRect = rr;

            // 2) 시험판: 오류가 나면 화면 아래에 작게 띄워요. (누르면 사라져요)
            var box = null, shown = 0;
            function report(msg) {
              if (shown >= 5) return; shown++;
              try {
                if (!box) {
                  box = document.createElement('div');
                  box.style.cssText = 'position:fixed;left:8px;bottom:8px;max-width:70%;z-index:2147483647;' +
                    'background:rgba(180,20,40,.92);color:#fff;font:14px/1.4 sans-serif;padding:8px 12px;border-radius:10px;white-space:pre-wrap';
                  box.onclick = function () { box.style.display = 'none'; };
                  (document.body || document.documentElement).appendChild(box);
                }
                box.style.display = 'block';
                box.textContent = (box.textContent ? box.textContent + '\n' : '오류 (사진 찍어 보내 주세요):\n') + String(msg).slice(0, 200);
              } catch (e) { }
            }
            window.addEventListener('error', function (e) {
              report((e.message || '오류') + (e.lineno ? ' @' + e.lineno : ''));
            });
            window.addEventListener('unhandledrejection', function (e) {
              var r = e.reason; report('약속 오류: ' + (r && (r.message || r)) );
            });
            var cw = console.warn;
            console.warn = function () {
              try { if (arguments[0] === 'pose') report('인식기: ' + (arguments[1] && (arguments[1].message || arguments[1]))); } catch (e) { }
              return cw.apply(console, arguments);
            };
          })();
          GOATEOF

          mkdir -p "$(dirname 'android/app/src/main/res/values/strings.xml')"
          cat > 'android/app/src/main/res/values/strings.xml' <<'GOATEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">혜광goat</string>
          </resources>
          GOATEOF

          mkdir -p "$(dirname 'android/app/src/main/res/values/colors.xml')"
          cat > 'android/app/src/main/res/values/colors.xml' <<'GOATEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#7FB4E6</color>
          </resources>
          GOATEOF

          mkdir -p "$(dirname 'android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml')"
          cat > 'android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'GOATEOF'
          <?xml version="1.0" encoding="utf-8"?>
