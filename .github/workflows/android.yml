      - name: 바꾸는 도구 받기 (esbuild, SIMD 없는 몸 인식기)
        shell: bash
        run: |
          set -e
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/tools" esbuild@0.24.0 @mediapipe/tasks-vision@0.10.14
          ls "$RUNNER_TEMP/tools/node_modules/@mediapipe/tasks-vision/wasm"
          pip install --quiet pillow

      - name: 앱 안에 혜광goat 넣기 (옛 엔진용으로 바꾸기) + 아이콘
        shell: bash
        run: |
          python3 android/prepare.py index.html android/app/src/main/assets android/app/src/main/res \
            "$RUNNER_TEMP/tools/node_modules/.bin/esbuild" "$RUNNER_TEMP/tools/node_modules/@mediapipe/tasks-vision"

      - name: APK 만들기
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk hyegwang-goat.apk

      - name: 내려받기 칸에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: 혜광goat 안드로이드 앱
          make_latest: true
          body: |
            전자칠판·태블릿에 까는 혜광goat 시험용 앱이에요. (만든 번호: ${{ github.run_number }})
            아래 hyegwang-goat.apk를 기기에서 내려받아 설치하세요.
          files: hyegwang-goat.apk

      - name: 작업 결과에도 남기기
        uses: actions/upload-artifact@v4
        with:
          name: hyegwang-goat-apk
          path: hyegwang-goat.apk
